<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Background -->
  <rect width="500" height="500" fill="#121212" />

  <!-- Outer guide circle -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Glowing Pixel dt monogram in amber -->
  <g filter="url(#glow)" fill="#ffb000">
    <!-- Pixel grid letters dt -->
    <!-- "d" character -->
    <rect x="200" y="110" width="30" height="280" /> <!-- vertical line of d -->
    <rect x="110" y="200" width="90" height="30" />  <!-- top cross d -->
    <rect x="110" y="360" width="90" height="30" />  <!-- bottom cross d -->
    <rect x="110" y="230" width="30" height="130" /> <!-- left circle side of d -->

    <!-- "t" character -->
    <rect x="290" y="110" width="30" height="280" /> <!-- vertical line of t -->
    <rect x="250" y="170" width="110" height="30" /> <!-- t bar -->
    <rect x="320" y="360" width="30" height="30" />  <!-- t tail -->
  </g>
</svg>
