<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- CRT scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    </pattern>
    <!-- Screen glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Background -->
  <rect width="500" height="500" fill="#121212" />
  
  <!-- Outer circle guide -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Retro Beige Monitor Bezel -->
  <rect x="90" y="80" width="320" height="260" rx="24" ry="24" fill="#d3cbbd" stroke="#b0a798" stroke-width="4" />
  
  <!-- Screen Area (Classic DOS Blue Screen) -->
  <rect x="110" y="100" width="280" height="210" rx="12" ry="12" fill="#0000a8" />
  
  <!-- Physical Brand Badge at bottom of monitor bezel -->
  <rect x="180" y="318" width="140" height="16" rx="2" ry="2" fill="#d3cbbd" stroke="#b0a798" stroke-width="2" />
  <text x="250" y="331" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#5c5346" text-anchor="middle" letter-spacing="1">DEV TECH</text>

  <!-- Screen Stand -->
  <path d="M 190,340 L 310,340 L 330,400 L 170,400 Z" fill="#d3cbbd" stroke="#b0a798" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Screen Content (Glowing Terminal Code Editor) -->
  <g filter="url(#glow)">
    <!-- Top Menu Bar of DOS Editor -->
    <rect x="110" y="100" width="280" height="16" fill="#ffffff" rx="2" ry="2" opacity="0.9" />
    <text x="120" y="112" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#0000a8">File  Edit  Search  Run  Compile</text>

    <!-- Source code lines -->
    <text x="125" y="145" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" font-weight="bold">#include &lt;dev_tech.h&gt;</text>
    <text x="125" y="165" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" font-weight="bold">int main() {</text>
    <text x="140" y="185" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffff55" font-weight="bold">init_web("navojoa");</text>
    <text x="140" y="205" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffff55" font-weight="bold">launch_system();</text>
    <text x="140" y="225" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" font-weight="bold">return 0;</text>
    <text x="125" y="245" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" font-weight="bold">}</text>

    <!-- Glowing amber blinking cursor at screen center-bottom -->
    <rect x="140" y="255" width="8" height="11" fill="#ffff55" />

    <!-- Bottom Status Bar -->
    <rect x="110" y="294" width="280" height="16" fill="#ffffff" rx="2" ry="2" opacity="0.9" />
    <text x="120" y="306" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#0000a8">F1 Help  F2 Save  F9 Compile</text>
    
    <!-- Red Power LED on Beige Bezel -->
    <circle cx="370" cy="370" r="5" fill="#ff3333" />
  </g>

  <!-- Scanlines overlay -->
  <rect x="110" y="100" width="280" height="210" rx="12" ry="12" fill="url(#scanlines)" pointer-events="none" />
</svg>
